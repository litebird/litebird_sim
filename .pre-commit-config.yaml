repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  # This makes sure that uv.lock is up to date when pyproject.toml
  # is changed
  rev: 0.11.26
  hooks:
    - id: uv-lock
- repo: https://github.com/asottile/pyupgrade
  rev: v3.21.2
  hooks:
    - id: pyupgrade
      args: [--py311-plus]
      files: '^(litebird_sim)/.*\.py$'
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.15.20
  hooks:
    # Run the linter.
    - id: ruff
      types_or: [ python, pyi, jupyter ]
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
      types_or: [ python, pyi, jupyter ]
- repo: https://github.com/kynan/nbstripout
  # Keeps the notebook outputs (they are what gets rendered in the docs) but
  # strips execution counts and kernel metadata, which otherwise churn on every
  # re-run and make notebook diffs unreadable.
  rev: 0.9.1
  hooks:
    - id: nbstripout
      args: ["--keep-output", "--extra-keys", "metadata.kernelspec metadata.language_info.version"]
